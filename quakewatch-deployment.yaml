apiVersion: apps/v1
kind: Deployment
metadata:
  name: quakewatch
  labels:
    app: quakewatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quakewatch
  template:
    metadata:
      labels:
        app: quakewatch
    spec:
      containers:
      - name: quakewatch
        image: rfabian665/quakewatch
        env:
          - name: QUAKE_PORT
            valueFrom:
              configMapKeyRef:
                name: quakewatch-config
                key: quake_port
          - name: FLASK_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: quakewatch-secret
                key: flask_secret_key
        ports:
          - containerPort: 8888
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8888
        readinessProbe:
          httpGet:
            path: /health
            port: 8888
